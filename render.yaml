# Render blueprint for the Relay staging service.
#
# Apply with: Render dashboard -> New -> Blueprint -> point at this repository.
#
# The database is deliberately NOT defined here. Supabase hosts Postgres, so
# DATABASE_URL is set as a Render secret rather than provisioned by Render. See
# docs/DEPLOYMENT.md for the exact values and the order to do things in.

services:
  - type: web
    name: relay-staging
    runtime: node
    plan: starter
    region: singapore
    branch: mvp

    # The client is built here because the server serves client/dist. Skipping
    # this leaves the app serving a stale bundle, or nothing at all.
    #
    # --include=dev on the client install is deliberate: vite and typescript are
    # devDependencies, and npm omits those whenever NODE_ENV is "production".
    # NODE_ENV is "staging" here so they would install anyway, but relying on
    # that would make the build break the day this is copied to production.
    buildCommand: npm ci && npm --prefix client ci --include=dev && npm --prefix client run build

    # Run the authorized migration job separately before deploying this release.
    # Supply MIGRATION_DATABASE_URL to that controlled job only, never to this
    # web service. The job/roles are not provisioned by this blueprint.
    # This check uses the runtime DATABASE_URL and never applies migrations.
    # preDeployCommand requires an eligible paid instance type.
    preDeployCommand: npm run verify:deploy

    startCommand: npm start

    # Readiness, not liveness: this also reports 503 while migrations are
    # pending, so a half-deployed instance never receives traffic.
    healthCheckPath: /api/health/ready

    autoDeploy: false

    envVars:
      - key: NODE_ENV
        value: staging

      # Render injects PORT; config.js reads it. Listed for clarity only.
      - key: NODE_VERSION
        value: "24"

      # Application-role PostgreSQL connection, without schema migration rights.
      # Persistent Node: use direct networking or a session pool appropriate to
      # the host. Budget all process pools; transaction pooling is not automatic.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: enable
      # Optional custom trust: set DATABASE_SSL_CA as a multiline PEM secret if
      # the selected database requires it. Never disable verification.
      - key: DATABASE_MAX_CONNECTIONS
        value: "10"
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: DATABASE_STATEMENT_TIMEOUT_MS
        value: "15000"
      - key: DATABASE_QUERY_TIMEOUT_MS
        value: "20000"
      - key: DATABASE_IDLE_TRANSACTION_TIMEOUT_MS
        value: "15000"

      # Required actual HTTPS origin and independently generated 32..4096-byte
      # admission secret. Neither is inherited from proxy headers or DB settings.
      - key: PUBLIC_APP_ORIGIN
        sync: false
      - key: AUTH_RATE_LIMIT_SECRET
        sync: false
      - key: OUTBOUND_DISPATCH_ENABLED
        value: "false"

      - key: LOG_LEVEL
        value: info
      - key: LOG_FORMAT
        value: json

      # Render terminates TLS and forwards over plain HTTP, so the original
      # scheme only survives in X-Forwarded-Proto.
      - key: TRUST_PROXY
        value: "true"
      - key: FORCE_SECURE_COOKIES
        value: "true"

      # Keep automated dispatch disabled until L1 execution gates pass.
      # A single process does not prevent API/worker or concurrent-request races.
      - key: WORKER_ENABLED
        value: "false"

      # Optional. Without it the deterministic local agents support sandbox
      # intelligence. Customer workflow and launch acceptance remain in docs/TASKS.md.
      - key: LLM_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
